<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal— Expense Tracker</title>
<link rel="stylesheet" href="style.css"> 
</head>
<body>

  <div class="app">

    <header class="topbar">
        
      <div class="brand">
        
        <span class="brand-mark">₹</span>
        <span class="brand-name">Ashwini</span>
      
      </div>
      
      <p class="brand-sub">Track what comes in, track what goes out.</p>
    </header>

    <section class="summary">
      <div class="summary-card balance">
        <span class="summary-label">Balance</span>
        <span class="summary-value" id="balance">₹0</span>
      </div>
      <div class="summary-card income">
        <span class="summary-label">Income</span>
        <span class="summary-value" id="income">₹0</span>
      </div>
      <div class="summary-card expense">
        <span class="summary-label">Expenses</span>
        <span class="summary-value" id="expenseTotal">₹0</span>
      </div>
    </section>

    <section class="form-card">
      <form id="entryForm">
        <div class="field grow">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="Coffee with team" required>
        </div>
        <div class="field">
          <label for="amount">Amount</label>
          <input type="number" id="amount" placeholder="150" step="0.01" required>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="bills">Bills</option>
            <option value="shopping">Shopping</option>
            <option value="health">Health</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>
        <div class="field type-toggle">
          <label>Type</label>
          <div class="toggle" id="typeToggle">
            <button type="button" class="toggle-btn active" data-type="expense">Expense</button>
            <button type="button" class="toggle-btn" data-type="income">Income</button>
          </div>
        </div>
        <button type="submit" class="add-btn">Add entry</button>
      </form>
    </section>

    <section class="list-section">
      <div class="list-header">
        <h2>Recent activity</h2>
        <div class="filter">
          <select id="filterCategory">
            <option value="all">All categories</option>
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="bills">Bills</option>
            <option value="shopping">Shopping</option>
            <option value="health">Health</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <ul class="entry-list" id="entryList"></ul>

      <div class="empty-state" id="emptyState">
        <p class="empty-title">No entries yet</p>
        <p class="empty-body">Add your first income or expense above to get started.</p>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
